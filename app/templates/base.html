<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ asset('favicon.svg') }}">
  <meta name="theme-color" content="#0f1420">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">🏃 {{ app_name }}</a>
    <nav id="topnav">
      <a href="/">Dashboard</a>

      <div class="nav-group">
        <button type="button" class="nav-top" aria-haspopup="true" aria-expanded="false">Allenamento <span class="caret">▾</span></button>
        <div class="nav-menu">
          <a href="/program">Programma</a>
          <a href="/calendar">Calendario</a>
          <a href="/plans">Piani</a>
          <a href="/esercizi">Esercizi</a>
        </div>
      </div>

      <div class="nav-group">
        <button type="button" class="nav-top" aria-haspopup="true" aria-expanded="false">Analisi <span class="caret">▾</span></button>
        <div class="nav-menu">
          <a href="/form">Forma</a>
          <a href="/progress">Progressi</a>
          <a href="/records">Record</a>
          <a href="/segments">Salite</a>
          <a href="/routes">Percorsi</a>
        </div>
      </div>

      <a href="/health">Salute</a>
      <a href="/conversations">Conversazioni</a>

      <div class="nav-group nav-group-end">
        <button type="button" class="nav-top" aria-haspopup="true" aria-expanded="false" title="Altro">⚙ <span class="caret">▾</span></button>
        <div class="nav-menu nav-menu-right">
          <a href="/duplicates">Duplicati</a>
          <a href="/settings">Impostazioni</a>
          <a href="/logout" class="muted">Esci</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    // highlight the current section (link + its parent group) and wire dropdowns
    (function () {
      const path = location.pathname;
      document.querySelectorAll("#topnav a").forEach(a => {
        const href = a.getAttribute("href");
        const match = (href === "/" && path === "/")
          || (href !== "/" && href !== "/logout" && path.startsWith(href));
        if (!match) return;
        a.classList.add("active");
        const grp = a.closest(".nav-group");
        if (grp) grp.querySelector(".nav-top").classList.add("active");
      });

      const groups = Array.from(document.querySelectorAll("#topnav .nav-group"));
      const closeAll = () => groups.forEach(g => {
        g.classList.remove("open");
        g.querySelector(".nav-top").setAttribute("aria-expanded", "false");
      });
      groups.forEach(g => {
        const btn = g.querySelector(".nav-top");
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const wasOpen = g.classList.contains("open");
          closeAll();
          if (!wasOpen) { g.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
        });
      });
      document.addEventListener("click", closeAll);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAll(); });
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    // Render AI markdown (chat bubbles etc.) to HTML, neutralizing raw HTML first
    // (markdown syntax doesn't use < >). Falls back to a minimal formatter.
    window.renderMd = function (text) {
      const t = String(text == null ? "" : text);
      if (window.marked && marked.parse) {
        return marked.parse(t.replace(/</g, "&lt;").replace(/>/g, "&gt;"), { breaks: true });
      }
      return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
              .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
